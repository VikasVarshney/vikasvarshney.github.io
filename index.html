<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vikasvarshney.github.io – File Uploader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 2rem 1rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; }
    header .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 0.5rem; }
    header .logo svg { fill: #e6edf3; }
    header h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.5px; }
    header .subtitle { color: #58a6ff; font-size: 0.9rem; margin-top: 4px; font-family: monospace; }
    header p.desc { color: #8b949e; font-size: 0.88rem; margin-top: 6px; }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 1.75rem;
      width: 100%; max-width: 560px; margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: 1rem; font-weight: 600; margin-bottom: 1.1rem;
      display: flex; align-items: center; gap: 8px; color: #e6edf3;
    }
    .card h2 .step {
      width: 22px; height: 22px; background: #1f6feb; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    label {
      display: block; font-size: 0.78rem; font-weight: 500;
      color: #8b949e; margin-bottom: 6px; margin-top: 14px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    label:first-of-type { margin-top: 0; }
    input[type="text"] {
      width: 100%; padding: 0.55rem 0.75rem;
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; color: #e6edf3; font-size: 0.9rem; outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 3px rgba(56,139,253,0.15);
    }
    .drop-zone {
      border: 2px dashed #30363d; border-radius: 10px;
      padding: 2.5rem 1rem; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s; position: relative;
    }
    .drop-zone.drag-over { border-color: #388bfd; background: rgba(56,139,253,0.05); }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .upload-icon { font-size: 2.5rem; margin-bottom: 0.6rem; }
    .drop-zone p { color: #8b949e; font-size: 0.9rem; }
    .drop-zone .hint { font-size: 0.78rem; color: #484f58; margin-top: 0.3rem; }
    #file-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; padding: 0.65rem 0.9rem;
    }
    .file-icon { font-size: 1.3rem; flex-shrink: 0; }
    .file-meta { flex: 1; min-width: 0; }
    .file-meta .file-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta .file-size { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
    .file-remove { background: none; border: none; cursor: pointer; color: #8b949e; font-size: 1.1rem; padding: 2px; line-height: 1; transition: color 0.15s; }
    .file-remove:hover { color: #f85149; }
    .folder-row { margin-top: 14px; }
    .upload-btn {
      width: 100%; padding: 0.75rem; background: #1f6feb;
      border: 1px solid #388bfd; border-radius: 8px; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1.25rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s;
    }
    .upload-btn:hover:not(:disabled) { background: #388bfd; }
    .upload-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #progress-area { display: flex; flex-direction: column; gap: 10px; }
    .progress-item {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; padding: 0.75rem 1rem;
    }
    .pi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pi-name { font-size: 0.88rem; font-weight: 500; }
    .pi-status { font-size: 0.78rem; padding: 2px 8px; border-radius: 20px; }
    .status-uploading { background: rgba(56,139,253,0.15); color: #388bfd; }
    .status-done      { background: rgba(35,134,54,0.2);  color: #3fb950; }
    .status-error     { background: rgba(248,81,73,0.15); color: #f85149; }
    .progress-bar-bg { background: #21262d; border-radius: 4px; height: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; background: #1f6feb; }
    .progress-bar-fill.done  { background: #238636; }
    .progress-bar-fill.error { background: #f85149; }
    .pi-link { margin-top: 6px; font-size: 0.8rem; }
    .pi-link a { color: #58a6ff; text-decoration: none; }
    .pi-link a:hover { text-decoration: underline; }
    footer { margin-top: 2rem; font-size: 0.78rem; color: #484f58; text-align: center; line-height: 1.8; }
    footer a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg">
      <path d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/>
    </svg>
    <h1>File Uploader</h1>
  </div>
  <div class="subtitle">vikasvarshney.github.io</div>
  <p class="desc">Upload files directly to your GitHub Pages repository</p>
</header>

<div class="card">
  <h2><span class="step">↑</span> Upload Files</h2>

  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" multiple />
    <div class="upload-icon">📂</div>
    <p>Drag &amp; drop files here, or <strong>click to browse</strong></p>
    <p class="hint">Any file type · Multiple files supported</p>
  </div>

  <div id="file-list"></div>

  <div class="folder-row">
    <label>Subfolder in repo (optional)</label>
    <input type="text" id="gh-folder" placeholder="e.g.  assets/  or  uploads/docs/" />
  </div>

  <button class="upload-btn" id="upload-btn" disabled>
    ⬆&nbsp; Upload to vikasvarshney.github.io
  </button>
</div>

<div class="card" id="progress-card" style="display:none;">
  <h2><span class="step">✓</span> Upload Progress</h2>
  <div id="progress-area"></div>
</div>

<footer>
  Files are committed via the <a href="https://docs.github.com/en/rest/repos/contents" target="_blank" rel="noopener">GitHub Contents API</a>.
</footer>

<script>
  const OWNER  = 'vikasvarshney';
  const REPO   = 'vikasvarshney.github.io';
  const BRANCH = 'main';
  const TOKEN  = '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';

  const $ = id => document.getElementById(id);
  let selectedFiles = [];

  const dz = $('drop-zone');
  dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files]);
  });
  $('file-input').addEventListener('change', e => {
    addFiles([...e.target.files]); e.target.value = '';
  });

  function addFiles(files) {
    files.forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name && x.size === f.size))
        selectedFiles.push(f);
    });
    renderFileList();
    $('upload-btn').disabled = selectedFiles.length === 0;
  }

  function renderFileList() {
    const list = $('file-list');
    list.innerHTML = selectedFiles.map((f, i) => `
      <div class="file-item">
        <span class="file-icon">${getIcon(f.name)}</span>
        <div class="file-meta">
          <div class="file-name">${esc(f.name)}</div>
          <div class="file-size">${fmtSize(f.size)}</div>
        </div>
        <button class="file-remove" data-i="${i}" title="Remove">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('.file-remove').forEach(btn =>
      btn.addEventListener('click', () => {
        selectedFiles.splice(+btn.dataset.i, 1);
        renderFileList();
        $('upload-btn').disabled = selectedFiles.length === 0;
      })
    );
  }

  function getIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    return ({
      jpg:'🖼',jpeg:'🖼',png:'🖼',gif:'🖼',webp:'🖼',svg:'🖼',
      pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊',csv:'📊',
      zip:'🗜',rar:'🗜',tar:'🗜',gz:'🗜',
      mp4:'🎬',mov:'🎬',avi:'🎬',
      mp3:'🎵',wav:'🎵',
      html:'🌐',css:'🎨',js:'⚙',ts:'⚙',json:'📋',
      py:'🐍',sh:'⚙',md:'📋',txt:'📋',
    })[ext] || '📎';
  }

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  $('upload-btn').addEventListener('click', async () => {
    if (!selectedFiles.length) return;
    $('progress-card').style.display = '';
    $('upload-btn').disabled = true;
    const area = $('progress-area');
    area.innerHTML = '';

    const rawFolder = $('gh-folder').value.trim().replace(/^\/+|\/+$/g, '');
    const headers = {
      'Authorization': `token ${TOKEN}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };

    for (const file of selectedFiles) {
      const pid = 'p' + Math.random().toString(36).slice(2);
      const filePath = rawFolder ? `${rawFolder}/${file.name}` : file.name;

      area.insertAdjacentHTML('beforeend', `
        <div class="progress-item" id="${pid}">
          <div class="pi-top">
            <span class="pi-name">${esc(filePath)}</span>
            <span class="pi-status status-uploading" id="${pid}-s">Uploading…</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="${pid}-b" style="width:35%"></div>
          </div>
          <div class="pi-link" id="${pid}-l"></div>
        </div>
      `);

      try {
        const content = await toBase64(file);
        const apiUrl  = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath}`;

        let sha = null;
        try {
          const chk = await fetch(apiUrl, { headers });
          if (chk.ok) sha = (await chk.json()).sha;
        } catch (_) {}

        const body = { message: `Upload ${file.name}`, content, branch: BRANCH, ...(sha ? { sha } : {}) };
        const res  = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
        const data = await res.json();

        if (res.ok) {
          $(`${pid}-b`).style.width = '100%';
          $(`${pid}-b`).classList.add('done');
          $(`${pid}-s`).textContent = 'Done ✓';
          $(`${pid}-s`).className = 'pi-status status-done';
          const ghLink   = data.content?.html_url || `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${filePath}`;
          const siteLink = `https://${OWNER}.github.io/${filePath}`;
          $(`${pid}-l`).innerHTML =
            `<a href="${ghLink}" target="_blank" rel="noopener">View on GitHub ↗</a>
             &nbsp;·&nbsp;
             <a href="${siteLink}" target="_blank" rel="noopener">View on site ↗</a>`;
        } else {
          throw new Error(data.message || `HTTP ${res.status}`);
        }
      } catch (err) {
        $(`${pid}-b`).style.width = '100%';
        $(`${pid}-b`).classList.add('error');
        $(`${pid}-s`).textContent = 'Failed';
        $(`${pid}-s`).className = 'pi-status status-error';
        $(`${pid}-l`).innerHTML = `<span style="color:#f85149;font-size:0.8rem;">${esc(err.message)}</span>`;
      }
    }

    selectedFiles = [];
    renderFileList();
  });

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
